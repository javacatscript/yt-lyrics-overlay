<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lyrics Overlay</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <main class="panel">
      <header class="head">
        <h1>Lyrics Overlay</h1>
        <p class="now" data-role="now">Nothing playing</p>
        <p class="badge" data-role="status">Waiting for YouTube Music…</p>
      </header>

      <button class="primary" type="button" data-role="open">
        Open floating overlay
      </button>
      <p class="hint" data-role="hint" hidden></p>
      <p class="hint" data-role="search-hint" hidden>
        <a data-role="search-link" href="#" target="_blank" rel="noreferrer noopener"
          >Search Google for lyrics</a
        >
      </p>

      <section class="plain" data-role="plain-section" hidden>
        <h2>Lyrics (no timings available)</h2>
        <pre class="plain-text" data-role="plain-text"></pre>
      </section>

      <section class="settings">
        <h2>Settings</h2>

        <label class="field">
          <span class="label-row">
            <span>Global sync offset</span>
            <output data-role="offset-out">0.0s</output>
          </span>
          <input
            type="range"
            data-role="offset"
            min="-5000"
            max="5000"
            step="100"
            value="0"
          />
          <small>Positive shows lyrics earlier. Per-track nudges override this.</small>
        </label>

        <label class="field">
          <span class="label-row">
            <span>Overlay text size</span>
            <output data-role="scale-out">1.0×</output>
          </span>
          <input
            type="range"
            data-role="scale"
            min="0.7"
            max="1.8"
            step="0.05"
            value="1"
          />
        </label>
      </section>

      <footer class="foot">
        Lyrics from
        <a href="https://lrclib.net" target="_blank" rel="noreferrer noopener">LRCLIB</a>.
      </footer>
    </main>
    <script type="module" src="./panel.ts"></script>
  </body>
</html>
